{% assign beyond = site.data.hometext["beyond-research"] %}
<div class="bg-body-tertiary" id="beyond-research">
  <div class="container col-xxl-8 px-6 py-8 py-lg-10">
    <div class="p-3 pb-md-4 mx-auto text-center">
      <h2 class="h1 text-uppercase">{{beyond.title}}</h2>
    </div>
    {% for item in beyond.list %}
    <div class="px-3 py-6 pb-md-6 mx-auto border-bottom">
      <h3 class="fs-3 text-body-secondary">
        {{item.title}}
      </h3>
      {% if item.text %}
      <p class="fs-5">
        {{item.text}}
      </p>
      {% endif %}
      {% if item.photos %}
      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 mt-2">
        {% for photo in item.photos %}
        <div class="col">
          <figure class="figure h-100 w-100 mb-0 text-center">
            <img src="{{ photo.image | relative_url }}"
                 alt="{{ photo.alt | default: photo.caption | default: item.title }}"
                 class="figure-img img-fluid rounded shadow-sm mb-2"
                 style="max-height: 20rem; width: auto;"
                 loading="lazy">
            {% if photo.caption %}
            <figcaption class="figure-caption text-center">{{ photo.caption }}</figcaption>
            {% endif %}
          </figure>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>
<!-- End of Beyond Research -->
